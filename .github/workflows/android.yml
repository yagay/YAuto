name: Android Fast Debug

on:
  push:
    branches: [ main, test, refactor/macrodroid-on-1003-20261008 ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: yauto-fast-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: MacroDroid and ShortX semantic parity regression
        run: python3 -m unittest discover -s tools -p 'test_source_semantic_parity.py'
      - name: MacroDroid terminology audit
        run: python3 tools/audit_macrodroid_catalog.py
      - name: AOSP bilingual terminology tests and audit
        run: |
          python3 -m unittest discover -s tools -p 'test_aosp_terms.py'
          python3 tools/audit_aosp_terms.py --output build/reports/aosp_terminology_audit.json
      - name: Complete MacroDroid-first and ShortX source parity inventory
        run: |
          python3 -m unittest discover -s tools -p 'test_reference_parity.py'
          python3 tools/audit_reference_parity.py --fail-on-unsafe
      - name: Verified picker merge audit
        run: |
          python3 -m unittest discover -s tools -p 'test_verified_picker_merges.py'
          python3 tools/audit_verified_picker_merges.py --fail-on-unsafe
      - name: Full picker title collision inventory
        run: |
          python3 -m unittest discover -s tools -p 'test_picker_duplicate_titles.py'
          python3 tools/audit_picker_duplicate_titles.py --fail-on-unresolved-zh --fail-on-unresolved-en
      - name: Runtime event source catalog coverage
        run: python3 -m unittest discover -s tools -p 'test_runtime_event_source_catalog.py'
      - name: Workspace event source configuration regression
        run: python3 -m unittest discover -s tools -p 'test_workspace_change_monitor.py'
      - name: Overlay result contract regression
        run: python3 -m unittest discover -s tools -p 'test_overlay_result_contract.py'
      - name: Runtime ingress and settings regression
        run: |
          python3 -m unittest discover -s tools -p 'test_security_runtime_guards.py'
          python3 -m unittest discover -s tools -p 'test_runtime_settings_wiring.py'
          python3 -m unittest discover -s tools -p 'test_source_spotify_area_parity.py'
      - name: One-tap unified method selector guard
        run: |
          python3 -m unittest discover -s tools -p 'test_unified_click_selector.py'
      - name: Unified picker parameter labels
        run: |
          python3 -m unittest discover -s tools -p 'test_picker_method_labels.py'
          python3 tools/audit_picker_method_labels.py --fail-on-duplicates --fail-on-missing
      - name: Per-feature implementation explanation audit
        run: |
          python3 -m unittest discover -s tools -p 'test_picker_method_explanations.py'
          python3 tools/audit_picker_method_explanations.py --fail-on-missing-or-duplicates
      - name: Runtime picker title coverage
        run: |
          python3 -m unittest discover -s tools -p 'test_picker_runtime_names.py'
          python3 tools/audit_picker_runtime_names.py --fail-on-generic-fallback
      - name: Feature name collision audit
        run: |
          python3 -m unittest discover -s tools -p 'test_feature_name_collisions.py'
          python3 tools/audit_feature_name_collisions.py --output build/reports/feature_name_collisions.json --fail-on-unsafe
      - name: Localization guard
        run: python3 .github/scripts/check-localization.py
      - name: Localization quality guard
        run: python3 .github/scripts/check-localization-quality.py
      - name: Shared navigation architecture guard
        run: python3 -m unittest discover -s tools -p 'test_navigation_architecture.py'
      - name: Startup safety guard
        run: python3 .github/scripts/check-startup-safety.py
      - name: Runtime event contract guard
        run: python3 .github/scripts/check-event-contracts.py
      - name: FeaturePack registry coverage regression
        run: python3 -m unittest discover -s tools -p 'test_featurepack_schema_inventory.py'
      - name: FeaturePack and UI Schema architecture inventory
        run: python3 tools/audit_featurepack_schema.py --fail-on-unified-violations
      - name: Architecture maintainability guard
        run: python3 .github/scripts/check-architecture.py
      - name: Root and LSPosed capability wiring audit
        run: python3 tools/audit_privileged_integration.py --fail-on-unwired

      - name: Verify core runtime, storage, importers, Android, accessibility and editor
        run: >
          gradle
          :core:capability:test
          :core:diagnostics:test
          :core:engine:test
          :core:importer:test
          :core:logging:test
          :core:registry:test
          :core:runtime:test
          :core:storage:test
          :feature:standard:test
          :importer:macrodroid:test
          :importer:shortx:test
          :importer:tasker:test
          :plugin:api:test
          :platform:accessibility:testDebugUnitTest
          :platform:root:test
          :platform:android:testDebugUnitTest
          :platform:xposed:testDebugUnitTest
          :ui:editor:testDebugUnitTest
          --configuration-cache
          --parallel
          --build-cache
          --stacktrace

      - name: Build debug APK
        run: >
          gradle
          :app:assembleDebug
          --configuration-cache
          --parallel
          --build-cache
          --stacktrace

      - name: Publish AOSP terminology audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YAuto-aosp-terminology-audit
          path: |
            build/reports/aosp_terminology_audit.json
            build/reports/full_source_parity_inventory.json
            build/reports/feature_name_collisions.json
            build/reports/verified_picker_merges.json
            build/reports/picker_duplicate_title_inventory.json
            build/reports/picker_runtime_title_coverage.json
            build/reports/picker_parameter_labels.json
            build/reports/picker_method_explanations.json
            build/reports/root_lsposed_integration.json
            build/reports/featurepack_schema_inventory.json
          if-no-files-found: warn

      - name: Normalize APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk YAuto-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YAuto-debug
          path: YAuto-debug.apk
          if-no-files-found: error
