name: Android Fast Debug

on:
  push:
    branches: [ main, test ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: yauto-fast-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Localization guard
        run: python3 .github/scripts/check-localization.py
      - name: Localization quality guard
        run: python3 .github/scripts/check-localization-quality.py
      - name: Startup safety guard
        run: python3 .github/scripts/check-startup-safety.py
      - name: Runtime event contract guard
        run: python3 .github/scripts/check-event-contracts.py
      - name: Architecture maintainability guard
        run: python3 .github/scripts/check-architecture.py

      - name: Verify picker taxonomy and editor behavior
        run: >
          gradle
          :core:registry:test
          :feature:standard:test
          :importer:macrodroid:test
          :platform:android:testDebugUnitTest
          :ui:editor:testDebugUnitTest
          --configuration-cache
          --parallel
          --build-cache
          --stacktrace

      - name: Build debug APK
        run: >
          gradle
          :app:assembleDebug
          --configuration-cache
          --parallel
          --build-cache
          --stacktrace

      - name: Normalize APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk YAuto-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YAuto-debug
          path: YAuto-debug.apk
          if-no-files-found: error
