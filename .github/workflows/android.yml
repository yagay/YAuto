name: Android Debug

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests
        run: gradle :core:engine:test :core:runtime:test :core:storage:test :core:diagnostics:test :importer:macrodroid:test :importer:tasker:test :importer:shortx:test :platform:android:testDebugUnitTest :platform:accessibility:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Normalize APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk YAuto-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YAuto-debug
          path: YAuto-debug.apk
          if-no-files-found: error
