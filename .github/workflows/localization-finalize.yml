name: Finalize Localization

on:
  push:
    branches: [ localization-final-scan ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization-final-scan
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Apply final localization migration
        run: python3 tools/finalize_localization.py
      - name: Remove language-specific aliases from Kotlin sets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cjk = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          pattern = re.compile(r'setOf\((.*?)\)', re.S)
          for path in Path('.').glob('**/src/main/kotlin/**/*.kt'):
              text = path.read_text(encoding='utf-8')
              def repl(match):
                  inner = match.group(1)
                  literals = re.findall(r'"(?:\\.|[^"\\])*"', inner)
                  if not literals or not any(cjk.search(x) for x in literals):
                      return match.group(0)
                  kept = [x for x in literals if not cjk.search(x)]
                  return 'setOf(' + ', '.join(kept) + ')'
              updated = pattern.sub(repl, text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
      - name: Localization guard
        run: python3 .github/scripts/check-localization.py
      - name: Unit tests
        run: gradle :core:engine:test :core:runtime:test :core:storage:test :core:diagnostics:test :feature:standard:test :plugin:api:test :importer:macrodroid:test :importer:tasker:test :importer:shortx:test :platform:android:testDebugUnitTest :platform:accessibility:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Commit generated source changes
        run: |
          if git diff --quiet -- core feature platform ui app importer gradle .github/scripts/check-localization.py; then
            echo "No generated source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core feature platform ui app importer gradle .github/scripts/check-localization.py
          git commit -m "refactor: finish full localization coverage"
          git push origin HEAD:localization-final-scan
