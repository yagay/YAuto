name: Feature Debug Build

on:
  push:
    branches:
      - feature/mass-data-flow-expansion-20261003

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Normalize APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk YAuto-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YAuto-debug
          path: YAuto-debug.apk
          if-no-files-found: error
