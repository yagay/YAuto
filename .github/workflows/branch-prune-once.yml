name: One-time remote branch cleanup
on:
  push:
    branches:
      - refactor/macrodroid-on-1003-20261008
    paths:
      - .github/workflows/branch-prune-once.yml
permissions:
  contents: write
jobs:
  delete-unwanted-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Keep main and selected development branch only
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (owner !== 'yagay' || repo !== 'YAuto') {
              throw new Error('Repository guard rejected unexpected repository');
            }
            const keep = new Set([
              'main',
              'refactor/macrodroid-on-1003-20261008',
            ]);
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });
            const names = new Set(branches.map(b => b.name));
            for (const name of keep) {
              if (!names.has(name)) {
                throw new Error('Required branch missing; refusing deletion: ' + name);
              }
            }
            let deleted = 0;
            const failed = [];
            for (const branch of branches) {
              if (keep.has(branch.name)) {
                core.info('KEEP ' + branch.name);
                continue;
              }
              if (branch.protected) {
                failed.push(branch.name + ': protected');
                core.warning('PROTECTED ' + branch.name);
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: 'heads/' + branch.name,
                });
                core.info('DELETED ' + branch.name);
                deleted++;
              } catch (error) {
                failed.push(branch.name + ': ' + (error.status ?? error.message));
                core.warning('FAILED ' + branch.name);
              }
            }
            const after = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            core.info('Deleted ' + deleted + '; remaining: ' + after.map(b => b.name).join(', '));
            if (failed.length || after.some(b => !keep.has(b.name)) || after.length !== 2) {
              core.setFailed('Cleanup incomplete: ' + failed.join('; '));
            }
